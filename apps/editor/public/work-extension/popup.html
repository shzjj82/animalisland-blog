<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.45 system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 12px;
        color: #191919;
      }
      label {
        display: block;
        margin: 0 0 4px;
        color: #666;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 8px;
        background: #191919;
        color: #fff;
        cursor: pointer;
      }
      p {
        margin: 8px 0 0;
        color: #666;
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <label for="code">工作台配对码</label>
    <input id="code" maxlength="6" placeholder="6 位数字" />
    <label for="bridge">配对地址（可留空自动探测）</label>
    <input id="bridge" placeholder="http://127.0.0.1:47321" />
    <button id="connect" type="button">连接 wiki-agent</button>
    <p id="status">未连接。在工作台复制配对码和地址。</p>
    <script src="popup.js"></script>
  </body>
</html>
