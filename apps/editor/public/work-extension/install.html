<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>安装 wiki-agent 工作助手</title>
    <style>
      body { font: 15px/1.6 system-ui; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #191919; }
      code { background: #f4f4f2; padding: 0.1em 0.35em; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>安装工作助手</h1>
    <ol>
      <li>Chrome / Edge / Brave / Arc 打开扩展管理页（Chrome 为 <code>chrome://extensions</code>）。</li>
      <li>打开「开发者模式」。</li>
      <li>「加载已解压的扩展程序」，选中这个 <code>work-extension</code> 文件夹。</li>
      <li>打开 wiki-agent 工作台，扩展会自己连上本机。</li>
    </ol>
    <p>请用你日常登录过的那个浏览器加载，这样工作台才能操作已登录的网页。</p>
  </body>
</html>
