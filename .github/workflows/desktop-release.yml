name: desktop-release

# 打包不依赖本机硬件：打 tag 就出 macOS / Windows 安装包，并上传到 GitHub Release。
# 版本号来自 tag（v0.0.2 -> 0.0.2），写入 package.json 与 tauri.conf.json，
# 产物名、下载页展示的版本号都由它推导，不需要再手工改 HTML。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.0.2"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 写入版本号
        shell: bash
        working-directory: apps/editor
        run: node scripts/set-version.mjs "${{ steps.ver.outputs.version }}"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Rust（macOS 需要两个架构做通用包）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/editor/src-tauri -> target

      # tauri.macos.conf.json / tauri.windows.conf.json 把 resources/node(.exe) 声明进了 bundle.resources，
      # 构建期就会校验存在性：没有这个文件 build.rs 直接 panic（本地打包由 pack-desktop.mjs 负责这一步）
      - name: 准备 Node 运行时
        shell: bash
        working-directory: apps/editor
        run: node scripts/copy-node.mjs ${{ matrix.name == 'macos' && 'darwin' || 'win32' }}

      # 关键：APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 只要是「存在的环境变量」，
      # 哪怕是空字符串，tauri 也会去跑公证，然后被 notarytool 以 Team ID 不合法打回来。
      # 所以没配齐证书时这些变量一个都不要写进环境。
      - name: 准备签名环境（没配证书就用临时签名）
        if: matrix.name == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              [ -n "$APPLE_CERTIFICATE" ] && echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "已配置 Developer ID：签名并公证"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "未配置签名证书：临时签名，不公证"
          fi

      # macOS：通用二进制（Apple 芯片 + Intel），只打 app，dmg 下一步自己生成
      - name: 打包 macOS
        if: matrix.name == 'macos'
        shell: bash
        working-directory: apps/editor
        run: pnpm exec tauri build --target universal-apple-darwin --bundles app

      # dmg 用 scripts/pack-macos-dmg.mjs 自己打：tauri 自带的 create-dmg 脚本
      # 会因为 bundle_dmg.sh 没有执行权限直接失败（Permission denied），自己打更稳
      - name: 生成 dmg
        if: matrix.name == 'macos'
        shell: bash
        working-directory: apps/editor
        run: node scripts/pack-macos-dmg.mjs

      - name: 收集 dmg
        if: matrix.name == 'macos'
        shell: bash
        run: |
          mkdir -p apps/editor/artifacts
          cp apps/editor/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg apps/editor/artifacts/

      # Windows：NSIS 安装版 + 便携版 zip（便携版由 pack-windows-portable.mjs 组装）
      # 安装版要现装 NSIS，失败也不能连累便携版 zip（下载页主要就是 zip）
      - name: 打包 Windows 安装版
        if: matrix.name == 'windows'
        shell: bash
        working-directory: apps/editor
        run: pnpm exec tauri build --bundles nsis
        continue-on-error: true

      # 便携版复用上一步已经打好的 exe，脚本里只组装 zip
      - name: 组装 Windows 便携版
        if: matrix.name == 'windows'
        shell: bash
        working-directory: apps/editor
        run: node scripts/pack-windows-portable.mjs

      - name: 收集 Windows 产物
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p apps/editor/artifacts
          # NSIS 安装版：有就带上，没有也不算失败
          if ls apps/editor/src-tauri/target/release/bundle/nsis/*.exe >/dev/null 2>&1; then
            cp apps/editor/src-tauri/target/release/bundle/nsis/*.exe apps/editor/artifacts/
          else
            echo "没有 NSIS 安装版，只出便携包"
          fi
          cp apps/editor/release/wiki-agent-*-windows.zip apps/editor/artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: wiki-agent-${{ steps.ver.outputs.version }}-${{ matrix.name }}
          path: apps/editor/artifacts/*
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 手动触发时 tag 可能还不存在，Release 需要一个 tag 才能挂上去
      - name: 补 tag（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}" || true
          git push origin "v${{ inputs.version }}" || true

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: wiki-agent ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true

      # secrets 不能用在 if 里（Actions 解析阶段就报 Unrecognized named-value），
      # 所以先用一步把它转成普通输出，再用这个输出去决定要不要上传
      - name: 判断是否配置了 OSS
        id: oss
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -n "$OSS_ACCESS_KEY_ID" ] && [ -n "$OSS_ACCESS_KEY_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # 安装包直接进对象存储，服务器只发页面和 /version.json，不再存大文件。
      # 上传脚本复用 apps/editor/scripts/lib/oss.mjs（依赖 apps/server 里的 ali-oss）。
      - uses: pnpm/action-setup@v4
        if: steps.oss.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.oss.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: 安装上传依赖
        if: steps.oss.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 上传到 OSS
        if: steps.oss.outputs.enabled == 'true'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.OSS_REGION || 'oss-cn-shanghai' }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET || 'championsea' }}
          OSS_DOWNLOAD_PREFIX: ${{ vars.OSS_DOWNLOAD_PREFIX || 'wiki-agent' }}
          OSS_PUBLIC_BASE: ${{ vars.OSS_PUBLIC_BASE }}
        run: |
          V="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          node apps/editor/scripts/ed.mjs oss upload "${V#v}" artifacts
