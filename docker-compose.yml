services:
  myblog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "20"
        PNPM_VERSION: "9.12.2"
    image: myblog:latest
    container_name: myblog
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      REPO_ROOT: /app
      DATABASE_PATH: /app/data/blog.db
      UPLOAD_DIR: /app/data/uploads
      # 生产同源托管，不必再开 CORS
      CORS_ORIGIN: ""
    volumes:
      # SQLite、本地上传、日志持久化
      - myblog-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  myblog-data:
